name: Production build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Test and package Windows x64
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      Logging__LogLevel__Default: Warning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.23.1'
          package-manager-cache: false
      - name: Build and test all components
        run: ./setup-local.ps1
      - name: Package production build
        env:
          BUILD_REF: ${{ github.ref_name }}
          BUILD_REF_TYPE: ${{ github.ref_type }}
        run: |
          $version = '1.0.0'
          if ($env:BUILD_REF_TYPE -eq 'tag') {
            if ($env:BUILD_REF -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw 'Release tags must be v<semver>.' }
            $version = $Matches[1]
          }
          ./publish-release.ps1 -SkipSetup -Version $version -OutputDirectory artifacts/SchoolSignage-win-x64
      - name: Smoke-test the packaged Production app
        run: ./scripts/test-release.ps1 -ReleaseRoot "$PWD/artifacts/SchoolSignage-win-x64"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SchoolSignage-win-x64
          path: |
            artifacts/SchoolSignage-win-x64.zip
            artifacts/SchoolSignage-win-x64.zip.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tested GitHub release
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SchoolSignage-win-x64
          path: release
      - name: Verify and publish the exact tested package
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd release && sha256sum --check SchoolSignage-win-x64.zip.sha256)
          notes="docs/releases/$RELEASE_TAG.md"
          if [ ! -f "$notes" ]; then echo "Add release notes for this tag before publishing." >&2; exit 1; fi
          gh release create "$RELEASE_TAG" release/SchoolSignage-win-x64.zip release/SchoolSignage-win-x64.zip.sha256 --verify-tag --title "School Signage ${RELEASE_TAG#v}" --notes-file "$notes"
